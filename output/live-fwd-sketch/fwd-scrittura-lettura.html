<div id="live-fwd-sketch">
  <style>
    #live-fwd-sketch { color: var(--foreground); display: grid; gap: calc(var(--font-size-base) * .8); }
    #live-fwd-sketch .pitch-example { display: grid; gap: calc(var(--font-size-base) * .8); }
    #live-fwd-sketch .pitch-example + .pitch-example { margin-top: calc(var(--font-size-base) * 5); }
    #live-fwd-sketch .sketch-stage { width: 100%; min-width: 0; }
    #live-fwd-sketch .sketch-svg { display: block; width: 100%; overflow: visible; }
    #live-fwd-sketch .sketch-svg text { fill: var(--foreground); font-family: "Segoe Print", "Comic Sans MS", sans-serif; font-size: 12px; }
    #live-fwd-sketch .sketch-svg .row-title { font-size: 20px; }
    #live-fwd-sketch .sketch-svg .wave { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #live-fwd-sketch h3 { font-family: "Segoe Print", "Comic Sans MS", sans-serif; font-size: 20px; font-weight: 700; font-style: italic; }
    #live-fwd-sketch .viz-controls .btn { font-family: "Segoe Print", "Comic Sans MS", sans-serif; font-size: 18px; font-style: italic; color: #000; background: color-mix(in srgb, var(--blue) 35%, var(--background)); border: 0; box-shadow: none; border-radius: 6px; padding: 6px 12px; }
    #live-fwd-sketch .viz-controls .btn:disabled { opacity: 1; }
  </style>
  <section id="live-fwd-fast" class="pitch-example" aria-label="Once forward, più una ottava">
  <h3>Play mode "Once forward"</h3>
  <div class="sketch-stage">
    <svg class="sketch-svg" role="img" aria-label="Una cache con WRITE arancio e READ blu; sotto, l'uscita audio cumulativa in azzurro chiaro, comprese le dissolvenze"></svg>
  </div>
  <div class="viz-controls">
    <button type="button" class="btn" data-prev aria-label="Previous frame">Previous</button>
    <button type="button" class="btn" data-play>Play</button>
    <button type="button" class="btn" data-next aria-label="Next frame">Next</button>
  </div>
  </section>
  <section id="live-fwd-slow" class="pitch-example" aria-label="Once forward, meno una ottava">
    <h3>Play mode "Once forward"</h3>
    <div class="sketch-stage">
      <svg class="sketch-svg" role="img" aria-label="Meno una ottava: la scrittura raggiunge la lettura; fade-out e ripartenza illustrativa con READ adiacente a sinistra di WRITE. La posizione del fade-in è semplificata rispetto al firmware."></svg>
    </div>
    <div class="viz-controls">
      <button type="button" class="btn" data-prev aria-label="Previous frame">Previous</button>
      <button type="button" class="btn" data-play>Play</button>
      <button type="button" class="btn" data-next aria-label="Next frame">Next</button>
    </div>
  </section>
  <script>
    (() => {
      const savedSteps = {...window.openai?.widgetState?.privateContent?.steps}; // Persist both independent animations in one state snapshot.
      function createExample(root, pitch, frames)
      {
      const svg = root.querySelector('.sketch-svg');
      const prev = root.querySelector('[data-prev]');
      const next = root.querySelector('[data-next]');
      const play = root.querySelector('[data-play]');
      let step = 0;
      let timer = null;
      if (Number.isInteger(savedSteps[pitch]))
      {
          step = Math.max(0, Math.min(4, savedSteps[pitch]));
      }
      const persist = () => {
        savedSteps[pitch] = step;
        window.openai?.setWidgetState?.({modelContent: {pitch, frame: step + 1, phase: frames[step].title}, privateContent: {steps: {...savedSteps}}})?.catch(() => {});
      };
      const stop = () => {
        if (timer !== null) clearTimeout(timer);
        timer = null;
        play.textContent = step === 4 ? 'Replay' : 'Play';
      };
      const line = (x1, y1, x2, y2, color, dash = '') => `<path d="M${x1},${y1} L${x2},${y2}" fill="none" stroke="${color}" stroke-width="1.4" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
      function draw() {
        const f = frames[step];
        const readFirst = pitch < 1 ? Math.floor(f.a)-3 : Math.floor(f.a); // Include the current eight-tap sinc support for slow playback.
        const readLast = pitch < 1 ? Math.floor(f.a+127*pitch)+4 : Math.ceil(f.a+127*pitch);
        const w = Math.max(280, root.querySelector('.sketch-stage').getBoundingClientRect().width);
        const left = w < 480 ? 146 : 160, right = w - (w < 480 ? 18 : Math.min(100, w*.12)+70);
        const x = n => left + (n - 512) * (right - left) / 1440; // Keep both waves on the same scale and include the final octave-up read block.
        const writeColor = 'var(--orange)';
        const readColor = 'var(--blue)';
        const outputColor = 'color-mix(in srgb, var(--blue) 55%, var(--background))'; // Light blue identifies the accumulated output.
        const neutral = 'var(--border)';
        const ink = 'var(--foreground)';
        const text = (px, py, value, anchor = 'start', className = '') => `<text x="${px}" y="${py}" text-anchor="${anchor}" class="${className}">${value}</text>`;
        const box = (start, end, cy, color, dashed = false, halfHeight = 27) => {
          const a = x(start), b = x(end + 1), top = cy - halfHeight, bottom = cy + halfHeight;
          return `<path d="M${a},${top + 1} Q${(a+b)/2},${top-1} ${b},${top} L${b-.6},${bottom} Q${(a+b)/2},${bottom+1} ${a},${bottom-.6} Z" fill="${color}" fill-opacity=".08" stroke="${color}" stroke-width="1.7" ${dashed ? 'stroke-dasharray="4 4"' : ''}/>`;
        };
        const sourceValue = (sample, q) => Math.sin((sample-512)*Math.PI*2/(sample > q ? 32 : 64)); // Previous-pass audio has twice the frequency of newly written audio.
        const wave = (start, end, cy, color, fade = 'normal', opacity = 1) => {
          const points = [];
          const n = Math.max(40, Math.ceil((x(end)-x(start))*2));
          for (let i=0; i<=n; i++) {
            const u=i/n, sample=start+(end-start)*u;
            const gain = fade==='out' ? 1-u : fade==='in' ? u : 1;
            const y=cy-20*gain*sourceValue(sample, f.q);
            points.push(`${i ? 'L' : 'M'}${x(sample).toFixed(2)},${y.toFixed(2)}`);
          }
          return `<path class="wave" d="${points.join(' ')}" stroke="${color}" stroke-width="1.8" opacity="${opacity}"/>`;
        };
        svg.setAttribute('viewBox', `0 35 ${w} 255`);
        svg.setAttribute('height', '255');
        let art = `<title>${f.title}</title><desc>Pitch ${pitch}. Blocco ${f.block}. Scrittura da ${f.q-127} a ${f.q}; prelievo da ${readFirst} a ${readLast}. ${f.gain==='out' ? 'Uscita sfumata da cento a zero per cento.' : f.gain==='in' ? 'Uscita sfumata da zero a cento per cento.' : 'Uscita a livello pieno.'}</desc>`;
        art += text(8, 92, 'Live Sampler', 'start', 'row-title');
        art += text(8, 116, 'Cache', 'start', 'row-title');
        art += text(8, 216, 'Audio Output', 'start', 'row-title');
        art += text(8, 240, pitch > 1 ? '+1 ottava' : '−1 ottava', 'start', 'row-title');
        art += line(left, 100, right, 100, neutral);
        art += wave(512, 1952, 100, ink, 'normal', .20);
        art += box(f.q-127, f.q, 100, writeColor);
        art += box(f.a, f.a+128*pitch-1, 100, readColor, false, 33); // Show the useful source span, excluding interpolation support, so octave ratios are exact.
        art += wave(f.q-127, f.q, 100, writeColor);
        art += wave(f.a, f.a+127*pitch, 100, readColor);
        art += text(x(f.q-63), 57, 'WRITE', 'middle');
        art += text(x(f.a+64*pitch), 153, 'READ', 'middle');
        const outputPoints = []; // Every frame emits 128 samples on the same scale, regardless of its source span or jump.
        for (let sampleIndex = 0; sampleIndex < 128; sampleIndex++)
        {
            const px = x(512+sampleIndex);
            const py = 224-25*sourceValue(frames[0].a-128*pitch+sampleIndex*pitch, frames[0].q-128);
            outputPoints.push(`${sampleIndex === 0 ? 'M' : 'L'}${px.toFixed(2)},${py.toFixed(2)}`);
        }
        for (let frameIndex = 0; frameIndex <= step; frameIndex++)
        {
            const frame = frames[frameIndex];
            for (let sampleIndex = 0; sampleIndex < 128; sampleIndex++)
            {
                const gain = frame.gain === 'out' ? 1-sampleIndex/127 : frame.gain === 'in' ? sampleIndex/127 : 1;
                const outputIndex = frameIndex*128+sampleIndex;
                const px = x(640+outputIndex);
                const py = 224-25*gain*sourceValue(frame.a+sampleIndex*pitch, frame.q);
                outputPoints.push(`L${px.toFixed(2)},${py.toFixed(2)}`);
            }
        }
        art += line(left, 224, x(640+frames.length*128), 224, neutral);
        for (let blockIndex = 0; blockIndex <= step+1; blockIndex++)
        {
            const blockStart = 512+blockIndex*128;
            art += box(blockStart, blockStart+127, 224, outputColor, false, 31);
        }
        art += `<path class="wave" d="${outputPoints.join(' ')}" stroke="${outputColor}" stroke-width="2"/>`;
        if (f.gain === 'in')
        {
          const a=x(frames[step-1].a+128*pitch), b=x(f.a);
          const direction = Math.sign(b-a);
          art += `<path d="M${a},163 Q${(a+b)/2},185 ${b},163 M${b-5*direction},166 L${b},163 L${b-2*direction},170" fill="none" stroke="${readColor}" stroke-width="1.6"/>`;
        }
        svg.innerHTML = art;
        prev.disabled = step===0;
        next.disabled = step===4;
        if (timer === null) {
          play.textContent = step === 4 ? 'Replay' : 'Play';
        }
      }
      function advance() {
        if (step===4) { stop(); return; }
        step++;
        draw();
        persist();
        if (step===4) stop();
        else timer=setTimeout(advance, 2300);
      }
      prev.addEventListener('click', () => { stop(); step=Math.max(0,step-1); draw(); persist(); });
      next.addEventListener('click', () => { stop(); step=Math.min(4,step+1); draw(); persist(); });
      play.addEventListener('click', () => {
        if (timer!==null) { stop(); return; }
        if (step===4) step=0;
        draw();
        play.textContent='Pause';
        timer=setTimeout(advance, 2300);
        persist();
      });
      window.addEventListener('openai:set_globals', event => {
        const value=event.detail?.globals?.widgetState?.privateContent?.steps?.[pitch];
        if (Number.isInteger(value))
        {
            savedSteps[pitch] = value;
        }
        if (Number.isInteger(value) && value!==step) { stop(); step=Math.max(0,Math.min(4,value)); draw(); }
      });
      new ResizeObserver(draw).observe(root.querySelector('.sketch-stage'));
      draw();
      }
      createExample(document.getElementById('live-fwd-fast'), 2, [
        { q: 1055, a: 512, gain: 'normal', title: 'Avvicinamento', block: 'j − 2' },
        { q: 1183, a: 768, gain: 'normal', title: 'La lettura si avvicina', block: 'j − 1' },
        { q: 1311, a: 1024, gain: 'out', title: 'Intersezione parziale e fade-out', block: 'j' },
        { q: 1439, a: 1440, gain: 'in', title: 'Salto avanti e fade-in', block: 'j + 1' },
        { q: 1567, a: 1696, gain: 'normal', title: 'Lettura oltre la scrittura', block: 'j + 2' }
      ]);
      createExample(document.getElementById('live-fwd-slow'), 0.5, [
        { q: 1023, a: 1120, gain: 'normal', title: 'La scrittura si avvicina alla lettura', block: 'j − 2' },
        { q: 1151, a: 1184, gain: 'normal', title: 'La scrittura sta raggiungendo la lettura', block: 'j − 1' },
        { q: 1279, a: 1248, gain: 'out', title: 'Intersezione e fade-out', block: 'j' },
        { q: 1407, a: 1216, gain: 'in', title: 'Fade-in con READ adiacente a WRITE: posizione illustrativa semplificata', block: 'j + 1' },
        { q: 1535, a: 1280, gain: 'normal', title: 'Lettura alle spalle della scrittura', block: 'j + 2' }
      ]);
    })();
  </script>
</div>
